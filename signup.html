<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Plus - Cadastro</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="signup-container">
        <main class="main-signs">
            <div class="logo-placeholder">
                <img class="logo-icon" src="./assets/Logo CarePlus Azul.svg" alt="Care Plus">
            </div>
            
            <h1 class="signup-title">Cadastro</h1>
            
            <form class="signup-form" id="signupForm">
                <section class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" placeholder="Informe seu Nome" required>
                </section>
                
                <section class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="Informe seu CPF" required>
                </section>

                <section class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Informe seu email" required>
                </section>

                <section class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Informe sua senha" required>
                </section>

                <section class="form-group">
                    <label for="passwordConfirm">Confirmar Senha</label>
                    <input type="password" id="passwordConfirm" placeholder="Informe sua senha" required>
                </section>
                
                <button type="submit" class="signup-button">Cadastrar</button>
            </form>
            
            <a href="./index.html" class="login-link">Já tem uma conta? <span>Entrar!</span></a>
        </main>
        <aside class="aside-img">
            <img class="side-image" src="./assets/Criança.png" alt="Uma criança sorrindo, representando a alegria e o cuidado que a Care Plus oferece aos seus clientes.">
        </aside>
    </div>
    
    <script src="./scripts/script.js"></script>
</body>
</html>

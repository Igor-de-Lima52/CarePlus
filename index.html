<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Plus - Login</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/signin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="ellipse ellipse-1"></div>
        <div class="ellipse ellipse-2"></div>
        <!-- <div class="vector-bg"></div> -->
        <aside class="aside-img">
            <img class="side-image" src="./assets/Veios.png" alt="Um casal de idosos sorrindo, representando a alegria e o cuidado que a Care Plus oferece aos seus clientes.">
        </aside>

        <main class="main-signs">
            <div class="logo-placeholder">
                <img class="logo-icon" src="./assets/Logo CarePlus Azul.svg" alt="Care Plus">
            </div>
            
            <h1 class="login-title">Login</h1>
            
            <form class="login-form" id="loginForm">
                <section class="form-group">
                    <label for="cpf-email">CPF ou Email:</label>
                    <input type="text" id="cpf-email" placeholder="Informe seu CPF" required>
                </section>
                
                <section class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" placeholder="Informe sua senha" required>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </section>
                
                <button type="submit" class="login-button">Entrar</button>
            </form>
            
            <a href="./signup.html" class="signup-link">Já tem uma conta? <span>Criar agora!</span></a>
        </main>
    </div>
    
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/script.js"></script>
</body>
</html>

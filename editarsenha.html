<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarePlus – Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/styles.css" />
  <link rel="stylesheet" href="./styles/sidebar.css" />
  <link rel="stylesheet" href="./styles/editardependente.css" />
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="principal">
    <div class="topbar">
      <button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
      <div class="perfil-header">
        <div class="perfil-foto">
          <div class="avatar-placeholder">👤</div>
        </div>
        <div class="perfil-nome-plano">
          <h2 id="topbar-name">Carregando...</h2>
          <span id="topbar-plan">Carregando...</span>
        </div>
      </div>
      <div class="topbar-direita">
        <div class="pontos-topo" id="topbar-points">⭐ 0 pts</div>
        <button class="btn-sair" onclick="sair()">↪ Sair</button>
      </div>
    </div>

    <form class="conteudo-perfil" id="form-editar-senha">
      <h3 class="form-title">Editar Perfil</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="senhaAntiga">Senha antiga:</label>
          <input id="senhaAntiga" type="password" placeholder="Informe sua senha antiga" />
        </div>
        <div class="form-group">
          <label for="novaSenha">Nova senha:</label>
          <input id="novaSenha" type="password" placeholder="Informe sua nova senha" />
        </div>
        <div class="form-actions">
          <button class="btn-cancelar" type="button">Cancelar</button>
          <button type="submit" class="btn-editar">Editar</button>
        </div>
      </div>
    </form>
  </main>
  <script src="./scripts/auth.js"></script>
  <script src="./scripts/sidebar.js"></script>
  <script src="./scripts/editarsenha.js"></script>
</body>
</html>

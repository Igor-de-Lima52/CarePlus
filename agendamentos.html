    <main class="principal">

        <div class="topbar">
            <button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
            <div class="perfil-header">
                <div class="perfil-foto">
                    <div class="avatar-placeholder">👤</div>
                </div>
                <div class="perfil-nome-plano">
                    <h2 id="topbar-name">Carregando...</h2>
                    <span id="topbar-plan">Carregando...</span>
                </div>
            </div>
            <div class="topbar-direita">
                <div class="pontos-topo" id="topbar-points">⭐ 0 pts</div>
                <button class="btn-sair" onclick="sair()">↪ Sair</button>
            </div>
        </div>


        <div class="conteudo">
            <section>
                <table class="tabela">
                    <thead class="tabela-titulo">
                        <tr>
                            <th>Paciente</th>
                            <th>Especialidade</th>
                            <th>Médico</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody class="tabela-linha">

                    </tbody>
                </table>
            </section>

            <div id="ajuste-btn-marcar">
                <button class="btn marcar" onclick="abrirModalMarcarConsulta()">Marcar consulta</button>
            </div>
        </div>
        

        <div id="modalOpcoes" class="modal-overlay" style="display: none;">
            <div class="modal-caixa">
                <h3>Opções de Agendamento</h3>
                <p>Deseja remarcar ou cancelar a consulta de <strong id="nomePaciente"></strong>?</p>
                
                <div class="modal-botoes-coluna">
                    <button class="btn-resgatar" onclick="confirmarAcao('remarcar')">📅 Remarcar</button>
                    <button class="btn-cancelar-modal" onclick="confirmarAcao('cancelar')">❌ Cancelar</button>
                    <button class="btn-voltar" onclick="fecharModalOpcoes()">Voltar</button>
                </div>
            </div>
        </div>

        <div id="modalMarcarConsulta" class="modal-overlay" style="display: none;">
            <div class="modal-caixa">
                <div class="fechar">
                    <h3>Novo Agendamento</h3>
                    <button class="btn-fechar-icone" onclick="fecharModalMarcarConsulta()">✕</button>
                </div>
                
                <form id="formAgendamento">
                    <div class="campo-selecao-customizado">
                        <label>Paciente</label>
                        <input type="text" id="paciente-input" placeholder="Pesquisar paciente..." autocomplete="off"> 
                        <ul id="paciente-lista" class="lista-dropdown oculta"></ul>
                    </div>

                    <div class="campo-selecao-customizado">
                        <label>Especialidade</label>
                        <input type="text" id="especialidade-input" placeholder="Selecione a especialidade..." autocomplete="off"> 
                        <ul id="especialidade-lista" class="lista-dropdown oculta"></ul>
                    </div>

                    <div class="campo-selecao-customizado">
                        <label>Clínica</label>
                        <input type="text" id="clinica-input" placeholder="Selecione a unidade..." autocomplete="off"> 
                        <ul id="clinica-lista" class="lista-dropdown oculta"></ul>
                    </div>

                    <div class="campo-selecao-customizado">
                        <label>Data Disponível</label>
                        <input type="text" id="data-input" placeholder="Escolha o dia..." autocomplete="off"> 
                        <ul id="data-lista" class="lista-dropdown oculta"></ul>
                    </div>

                    <div class="campo-selecao-customizado">
                        <label>Médico</label>
                        <input type="text" id="medico-input" placeholder="Selecione o profissional..." autocomplete="off"> 
                        <ul id="medico-lista" class="lista-dropdown oculta"></ul>
                    </div>

                    <div class="modal-rodape">
                        <button type="button" class="btn-secundario" onclick="fecharModalMarcarConsulta()">Cancelar</button>
                        <button type="button" class="btn-primario" onclick="salvarAgendamento()">Confirmar Agendamento</button>
                    </div>
                </form>
            </div>
        </div>

    <script src="./scripts/auth.js"></script>
    <script src="./scripts/sidebar.js"></script>
